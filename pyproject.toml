[project]
name = "vg-agent"
version = "0.1.0"
description = "VG assignment agent with sub-agent offloading, compaction, and JSONL traces."
requires-python = ">=3.10"
dependencies = [
    "litellm>=1.0",
    "prompt-toolkit>=3.0",
    "python-dotenv>=1.0",
    "rich>=13",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
dashboard = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "httpx>=0.27",
]

[project.scripts]
vg-agent = "vg_agent.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["vg_agent*", "dashboard*"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

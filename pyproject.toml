[project]
name = "vg-agent"
version = "0.1.0"
description = "VG assignment agent with sub-agent offloading, compaction, traces, and replay."
requires-python = ">=3.10"
dependencies = ["litellm>=1.0", "prompt-toolkit>=3.0", "rich>=13"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
vg-agent = "vg_agent.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

services:
  vg-agent:
    build: .
    network_mode: "none"
    working_dir: /workspace
    volumes:
      - ./workspace:/workspace
      - ./traces:/workspace/traces
    env_file:
      - path: .env
        required: false
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges
    pids_limit: 128

  vg-agent-live:
    build: .
    working_dir: /workspace
    volumes:
      - ./workspace:/workspace
      - ./traces:/workspace/traces
    env_file:
      - path: .env
        required: false
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges
    pids_limit: 128
